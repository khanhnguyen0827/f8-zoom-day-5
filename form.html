<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form cơ bản - Buổi 4</title>
    <!-- Reset CSS -->
    <link rel="stylesheet" href="./css/reset.css">
    <!-- Style CSS -->
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1 class="page-title">Form cơ bản (Buổi 4)</h1>
            <div class="back-home">
                <a href="./index.html" class="btn-back">&larr; Quay lại danh sách bài tập</a>
            </div>
        </header>

        <main>
            <form action="" method="post" class="basic-form">
                <div class="form-group">
                    <label for="basic-fullname" class="form-label">Họ và tên</label>
                    <input type="text" id="basic-fullname" class="text-input" placeholder="Nhập họ và tên">
                </div>

                <div class="form-group">
                    <label for="basic-email" class="form-label">Email</label>
                    <input type="email" id="basic-email" class="text-input" placeholder="Nhập email">
                </div>

                <div class="form-group">
                    <label for="basic-password" class="form-label">Mật khẩu</label>
                    <input type="password" id="basic-password" class="text-input" placeholder="Nhập mật khẩu">
                </div>

                <button type="submit" class="btn">Đăng ký</button>
            </form>
        </main>
    </div>
</body>
</html>
